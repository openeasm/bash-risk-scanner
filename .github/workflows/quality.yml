name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Corpus evaluation gates
        run: npm run evaluate

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: corpus-evaluation
          path: evaluation/results/
          if-no-files-found: error
          retention-days: 30
